# Praetor additions, sourced from ~/.config/hypr/hyprland.conf

# Agent scratchpads: floating terminal per agent, toggled with one key.
bindd = SUPER, A, Hermes agent, exec, praetor-scratchpad hermes
bindd = SUPER SHIFT, A, Claude Code, exec, praetor-scratchpad claude
bindd = SUPER CTRL, A, Codex, exec, praetor-scratchpad codex

windowrule = float on, match:class ^(org\.praetor\.(hermes|claude|codex))$
windowrule = center on, match:class ^(org\.praetor\.(hermes|claude|codex))$
windowrule = size 1100 700, match:class ^(org\.praetor\.(hermes|claude|codex))$
windowrule = opacity 0.96 0.92, match:class ^(org\.praetor\.(hermes|claude|codex))$

# Remote viewing: screen capture (wayvnc) cannot see the hardware cursor plane. A
# software cursor makes it visible in the stream but dirties the framebuffer on every
# move, which lags badly over VNC. Praetor keeps the hardware cursor and lets the VNC
# client draw a local dot at the pointer position instead (TigerVNC -DotWhenNoCursor=1).
# Uncomment only if you need the real pointer in screen recordings:
# cursor {
#     no_hardware_cursors = true
# }
