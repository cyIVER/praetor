# Obsidian: glass. Heavier blur, cool accent.
general {
    col.active_border = rgb(7FB4FF)
    col.inactive_border = rgb(2A303A)
    border_size = 2
    gaps_in = 6
    gaps_out = 14
}
decoration {
    rounding = 10
    blur {
        enabled = true
        size = 10
        passes = 3
        xray = true
    }
}
layerrule = blur, waybar
layerrule = blur, walker
layerrule = blur, notifications
