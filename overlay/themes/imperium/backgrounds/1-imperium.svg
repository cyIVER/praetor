  <rect width="2560" height="1600" fill="url(#g)"/>
  <!-- laurel ring -->
  <circle cx="1280" cy="800" r="420" fill="none" stroke="#C9A227" stroke-opacity="0.10" stroke-width="2"/>
  <circle cx="1280" cy="800" r="470" fill="none" stroke="#C9A227" stroke-opacity="0.05" stroke-width="1"/>
