      <stop offset="0%" stop-color="#1A1216"/>
      <stop offset="55%" stop-color="#0E0C10"/>
      <stop offset="100%" stop-color="#0B0A0C"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" x2="1">
