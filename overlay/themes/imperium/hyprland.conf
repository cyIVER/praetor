# Imperium: gold active border, crimson reserved for urgency.
general {
    col.active_border = rgb(C9A227)
    col.inactive_border = rgb(2A262E)
    border_size = 2
    gaps_in = 4
    gaps_out = 10
}
decoration {
    rounding = 6
    blur {
        enabled = true
        size = 6
        passes = 2
        xray = false
    }
}
# Blur only on layers, not on every window.
layerrule = blur on, match:namespace waybar
layerrule = blur on, match:namespace walker
layerrule = blur on, match:namespace notifications
